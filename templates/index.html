<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딥페이크 탐지 졸업 프로젝트</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 2rem; background-color: #f4f7f6; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 1.5rem; }
        .tab-button { padding: 1rem 1.5rem; cursor: pointer; background: none; border: none; font-size: 1rem; font-weight: 500; color: #777; }
        .tab-button.active { color: #3498db; border-bottom: 2px solid #3498db; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: .5rem; font-weight: 600; }
        input[type="file"], input[type="text"] { width: 100%; padding: .75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { display: block; width: 100%; padding: .8rem; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #2980b9; }
        .loader { display: none; text-align: center; padding: 2rem; }
        #results { display: none; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #eee; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; }
        .result-text h3 { margin-top: 0; }
        .result-text p { font-size: 1.2rem; font-weight: bold; }
        .real { color: green; }
        .fake { color: red; }
        .heatmap img { max-width: 100%; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>딥페이크 탐지 시스템</h1>
    

    <form id="predictionForm" method="POST" enctype="multipart/form-data">
        <div id="uploadTab" class="tab-content active">
            <div class="form-group">
                <label for="file">동영상 파일을 선택하세요:</label>
                <input type="file" name="file" id="file" accept="video/*" required>
            </div>
        </div>

        <button type="submit">분석 시작</button>
    </form>

    <div class="loader" id="loader">
        <p>영상을 분석 중입니다... 잠시만 기다려주세요.</p>
    </div>

    <div id="results">
        <h2>분석 결과</h2>
        <div class="result-grid">
            <div class="result-text">
                <h3>최종 판별</h3>
                <p id="predictionText"></p>
            </div>
            <div class="heatmap">
                <h3>XAI 분석 (히트맵)</h3>
                <p id="heatmapDescription"></p>
                <img id="heatmapImage" src="" alt="XAI Heatmap">
            </div>
        </div>
    </div>
</div>

<script>
    /*
    function openTab(evt, tabName) {

            document.getElementById('youtube_url').setAttribute('required', 'required');
        }
    }
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('.tab-button').click();
    });
    */

    const form = document.getElementById('predictionForm');
    const loader = document.getElementById('loader');
    const resultsDiv = document.getElementById('results');
    const predictionText = document.getElementById('predictionText');
    const heatmapImage = document.getElementById('heatmapImage');
    const heatmapDescription = document.getElementById('heatmapDescription');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        loader.style.display = 'block';
        resultsDiv.style.display = 'none';
        const formData = new FormData(this);
        
        fetch('/predict', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            loader.style.display = 'none';
            resultsDiv.style.display = 'block';

            if (data.error) {
                alert('오류: ' + data.error);
                return;
            }

            const prediction = data.prediction;
            const isFake = data.is_fake;
            const heatmapPath = data.heatmap_path;

            if (isFake) {
                predictionText.innerHTML = `FAKE <span class="fake">(${(prediction * 100).toFixed(2)}%)</span>`;
                predictionText.className = 'fake';
                heatmapDescription.innerHTML = "모델이 <strong>'의심스럽게'</strong> 본 영역입니다.";
            } else {
                predictionText.innerHTML = `REAL <span class="real">(${(1 - prediction) * 100}%)</span>`;
                predictionText.className = 'real';
                heatmapDescription.innerHTML = "모델이 <strong>'진짜임을 확인하기 위해 집중적으로 검토'</strong>한 영역입니다.";
            }
            
            heatmapImage.src = heatmapPath + '?t=' + new Date().getTime();
        })
        .catch(error => {
            loader.style.display = 'none';
            alert('오류가 발생했습니다: ' + error);
        });
    });
</script>

</body>
</html>
